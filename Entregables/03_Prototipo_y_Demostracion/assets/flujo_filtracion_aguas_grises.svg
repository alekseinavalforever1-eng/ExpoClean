<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 470">
<rect width="1400" height="470" fill="#f8fbff"/><defs><marker id="m" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#3c86c5"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#17324d}.box{stroke:#47718c;stroke-width:3}.arrow{stroke:#3c86c5;stroke-width:7;fill:none;marker-end:url(#m)}</style>
<text x="45" y="42" font-size="26" font-weight="bold">Sistema de filtración y pretratamiento de aguas grises</text><g transform="translate(30,85)">
<rect class="box" width="175" height="240" rx="14" fill="#d7eaf7"/><text x="22" y="35" font-size="20" font-weight="bold">1. Entrada</text><path d="M35 80 Q88 45 140 80 L125 195 Q88 220 50 195Z" fill="#876044" opacity=".75"/><text x="25" y="225" font-size="15">Agua de trapeador</text><path class="arrow" d="M180 120 H230"/>
<rect class="box" x="230" width="175" height="240" rx="14" fill="#f9e1bd"/><text x="246" y="35" font-size="19" font-weight="bold">2. Malla</text><path d="M255 105 H380 M255 140 H380 M280 75 V175 M320 75 V175 M360 75 V175" stroke="#583a20" stroke-width="5"/><text x="247" y="205" font-size="15">Retiene residuos</text><text x="247" y="225" font-size="15">gruesos</text><path class="arrow" d="M410 120 H460"/>
<rect class="box" x="460" width="175" height="240" rx="14" fill="#ead7a1"/><text x="478" y="35" font-size="19" font-weight="bold">3. Sedimentación</text><path d="M495 75 H600 V190 Q548 220 495 190Z" fill="#9b704f" opacity=".7"/><path d="M505 178 Q550 160 590 180" stroke="#593d27" stroke-width="12" fill="none"/><text x="482" y="220" font-size="15">Lodos al fondo</text><path class="arrow" d="M640 120 H690"/>
<rect class="box" x="690" width="205" height="240" rx="14" fill="#cfe9d5"/><text x="710" y="35" font-size="19" font-weight="bold">4. Filtración</text><rect x="720" y="65" width="145" height="35" fill="#a9a9a9"/><rect x="720" y="100" width="145" height="35" fill="#e8d1a2"/><rect x="720" y="135" width="145" height="35" fill="#4b413b"/><rect x="720" y="170" width="145" height="35" fill="#d9e1e6"/><text x="722" y="225" font-size="14">Grava + arena + carbón</text><text x="722" y="243" font-size="14">activado</text><path class="arrow" d="M900 120 H950"/>
<rect class="box" x="950" width="175" height="240" rx="14" fill="#d5e9f8"/><text x="965" y="35" font-size="19" font-weight="bold">5. Monitoreo</text><circle cx="1038" cy="105" r="38" fill="#30343b"/><rect x="1018" y="140" width="40" height="55" fill="#5b8bb0"/><text x="970" y="225" font-size="14">ESP32 + bomba</text><text x="970" y="243" font-size="14">+ turbidez</text><path class="arrow" d="M1130 120 H1180"/>
<rect class="box" x="1180" width="175" height="240" rx="14" fill="#d4f0e0"/><text x="1195" y="35" font-size="19" font-weight="bold">6. Almacenamiento</text><rect x="1212" y="85" width="110" height="105" rx="10" fill="#79c9ed" opacity=".8"/><text x="1200" y="220" font-size="14">Evaluar reúso no crítico</text></g>
<text x="50" y="390" font-size="18">La turbidez de entrada y salida se compara para medir la eficiencia del proceso.</text><text x="50" y="420" font-size="18">Si la calidad no es suficiente, el agua requiere tratamiento adicional o gestión como residual.</text>
</svg>
